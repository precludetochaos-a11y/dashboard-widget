<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<title>Dashboard Widget</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--ink:#e8eaed;--dim:#9aa4b2;--accent:#ffcf4a;--red:#e5534b;--grn:#7bd88f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:.85rem;width:360px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:.8rem 1rem;margin-bottom:.65rem}
  .card:last-of-type{margin-bottom:0}
  h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:.4rem}
  .big{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:.78rem;margin-top:.1rem}
  ul{list-style:none}
  li{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem 0;border-top:1px solid var(--line)}
  li:first-child{border-top:none}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:.38rem;flex:none}
  .nm{font-weight:600;font-size:.88rem}
  .station{color:var(--dim);font-size:.74rem}
  .pill{font-size:.6rem;font-weight:700;color:#0f1115;background:var(--grn);
        border-radius:999px;padding:.04rem .4rem;margin-left:.3rem;vertical-align:middle}
  .sched-row{padding:.3rem 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:.5rem;align-items:start}
  .sched-row:first-child{border-top:none}
  .sched-time{color:var(--dim);font-size:.74rem;white-space:nowrap;padding-top:.05rem}
  .sched-name{font-weight:700;font-size:.84rem}
  .sched-title{font-size:.8rem;color:var(--accent)}
  .sched-lesson{font-size:.77rem;margin-top:.1rem}
  .sched-hw-item{padding:.15rem 0;font-size:.77rem;display:grid;grid-template-columns:auto 1fr;gap:.35rem;border-top:1px solid var(--line)}
  .sched-hw-item:first-child{border-top:none}
  .sched-hw-cls{font-weight:700;font-size:.72rem;color:var(--dim);white-space:nowrap}
  .assess{color:var(--red);font-size:.77rem;margin-top:.1rem}
  .stale{color:var(--dim);font-size:.68rem;font-style:italic;margin-top:.35rem}
  .msg{color:var(--dim);font-size:.84rem;padding:.15rem 0}
  .err{color:var(--red);font-size:.82rem}
  .updated{color:var(--dim);font-size:.68rem;text-align:right;margin-top:.5rem}
</style></head>
<body>

<div class="card">
  <h2>Today</h2>
  <div class="big" id="clock">—</div>
  <div class="sub" id="date">—</div>
</div>

<div class="card">
  <h2>Lunch · Entrées</h2>
  <ul id="lunch"><li><span class="msg">Loading…</span></li></ul>
</div>

<div class="card">
  <h2>Today · Lessons</h2>
  <div id="sched-lessons"><div class="msg">Open the Chrome dashboard tab once to sync.</div></div>
  <div class="stale" id="stale"></div>
</div>

<div class="card">
  <h2 style="color:var(--grn)">Today · Homework</h2>
  <div id="sched-hw"><div class="msg">—</div></div>
</div>

<div class="updated" id="updated"></div>

<script>
const DOT={Green:"#4caf50",Yellow:"#f4c430",Red:"#e5534b"};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=d=>String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0")+"/"+d.getFullYear();

/* clock */
function tick(){
  const n=new Date();
  document.getElementById("clock").textContent=n.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  document.getElementById("date").textContent=n.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});
}
tick(); setInterval(tick,15000);

/* lunch */
function renderLunch(items){
  const box=document.getElementById("lunch");
  if(!items){box.innerHTML='<li><span class="msg">Loading…</span></li>';return;}
  if(!items.length){box.innerHTML='<li><span class="msg">No entrées today — weekend or holiday.</span></li>';return;}
  box.innerHTML=items.map(it=>{
    const color=DOT[it.dot]||"#666";
    const life=(it.allergens&&it.allergens.lifestyleNames||[]).map(t=>'<span class="pill">'+esc(t)+'</span>').join("");
    const st=it.displayStation?'<div class="station">'+esc(it.displayStation)+'</div>':"";
    return '<li><span class="dot" style="background:'+color+'"></span><div><div class="nm">'+esc(it.name)+life+'</div>'+st+'</div></li>';
  }).join("");
}

/* schedule */
function renderSchedule(days){
  const lb=document.getElementById("sched-lessons");
  const hb=document.getElementById("sched-hw");
  if(!days||!days.length){
    lb.innerHTML='<div class="msg">Open Chrome dashboard to sync.</div>';
    hb.innerHTML='<div class="msg">—</div>';return;
  }
  const today=days.find(d=>d.date===fmt(new Date()));
  if(!today){
    lb.innerHTML='<div class="msg">No classes today.</div>';
    hb.innerHTML='<div class="msg">Nothing due.</div>';return;
  }
  const lr=today.classes.filter(c=>c.title||c.lesson.length||c.assess.length).map(c=>{
    const time=esc(c.start)+(c.end?"–"+esc(c.end):"");
    const title=c.title?'<div class="sched-title">'+esc(c.title)+'</div>':"";
    const lesson=c.lesson.length?'<div class="sched-lesson">'+c.lesson.map(x=>"• "+esc(x)).join("<br>")+'</div>':"";
    const assess=c.assess.length?'<div class="assess">'+c.assess.map(x=>"⚠ "+esc(x)).join("<br>")+'</div>':"";
    return '<div class="sched-row"><div class="sched-time">'+time+'</div><div><div class="sched-name">'+esc(c.name)+'</div>'+title+lesson+assess+'</div></div>';
  }).join("");
  lb.innerHTML=lr||'<div class="msg">No lessons today.</div>';
  const hr=today.classes.filter(c=>c.homework.length).map(c=>
    '<div class="sched-hw-item"><div class="sched-hw-cls">'+esc(c.name)+'</div><div>'+c.homework.map(x=>"• "+esc(x)).join("<br>")+'</div></div>'
  ).join("");
  hb.innerHTML=hr||'<div class="msg">Nothing due today.</div>';
}

/* load from GitHub Pages static files — no proxy, no CORS issues */
async function loadAll(){
  const t="?t="+Date.now(); // cache-bust
  try{
    const items=await(await fetch("https://precludetochaos-a11y.github.io/dashboard-widget/lunch.json"+t)).json();
    renderLunch(items);
  }catch(e){renderLunch([]);}
  try{
    const days=await(await fetch("https://precludetochaos-a11y.github.io/dashboard-widget/schedule.json"+t)).json();
    renderSchedule(days);
    document.getElementById("stale").textContent="Schedule synced from Chrome dashboard";
  }catch(e){
    renderSchedule([]);
    document.getElementById("stale").textContent="Open Chrome dashboard to sync schedule";
  }
  document.getElementById("updated").textContent=
    "updated "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}
loadAll();
setInterval(loadAll,30*60*1000);

</script>
</body></html>
